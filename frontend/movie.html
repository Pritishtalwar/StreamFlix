<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11100f" />
    <meta name="description" content="Explore the story, rating, and details for a title on StreamFlix." />
    <link rel="icon" type="image/png" href="./public/favicon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Title details | StreamFlix</title>
  </head>
  <body>
    <div id="site-header"></div>
    <main id="app" data-page="details"></main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog class="player-dialog" id="player-dialog" aria-label="Sample movie player">
      <div class="player-shell" role="presentation">
        <button class="dialog-close" type="button" data-action="close-player" aria-label="Close player">
          <span aria-hidden="true">×</span>
        </button>
        <video id="movie-player" preload="metadata" playsinline src="./public/sample.mp4">
          Your browser does not support video playback.
        </video>
        <div class="player-overlay">
          <div class="player-bottom-controls">
            <div class="player-progress" aria-hidden="true">
              <span class="player-progress-meter"></span>
            </div>
            <div class="player-control-row">
              <div class="player-left-controls">
                <button class="player-icon-button player-toggle" type="button" data-action="toggle-play" aria-label="Play video">▶</button>
                <button class="player-icon-button skip-button" type="button" data-action="seek-by" data-seconds="-10" aria-label="Go back 10 seconds" title="Back 10 seconds">
                  <span aria-hidden="true">↶</span><span class="skip-label">10</span>
                </button>
                <button class="player-icon-button skip-button" type="button" data-action="seek-by" data-seconds="10" aria-label="Go forward 10 seconds" title="Forward 10 seconds">
                  <span aria-hidden="true">↷</span><span class="skip-label">10</span>
                </button>
                <button class="player-icon-button player-volume" type="button" data-action="toggle-mute" aria-label="Mute video">🔊</button>
                <div class="player-time" id="movie-player-time">00:00:00 / 00:00:00</div>
              </div>
              <div class="player-title-row" aria-live="polite">
                <span class="player-show">Movie Title</span>
              </div>
              <div class="player-right-controls" aria-label="Video settings">
                <button class="player-utility" type="button" data-action="captions" aria-label="Open captions" aria-expanded="false" aria-controls="player-captions-menu">▤</button>
                <button class="player-utility" type="button" data-action="toggle-settings" aria-label="Open player settings" aria-expanded="false" aria-controls="player-settings-menu">⚙</button>
                <button class="player-utility" type="button" data-action="toggle-fullscreen" aria-label="Enter fullscreen">⤢</button>
              </div>
            </div>
          </div>
          <div class="player-settings-menu" id="player-settings-menu" aria-label="Player settings" hidden>
            <p>Playback speed</p>
            <div class="player-speed-options">
              <button type="button" data-action="set-playback-speed" data-speed="1" aria-pressed="true">1×</button>
              <button type="button" data-action="set-playback-speed" data-speed="1.25" aria-pressed="false">1.25×</button>
              <button type="button" data-action="set-playback-speed" data-speed="1.5" aria-pressed="false">1.5×</button>
              <button type="button" data-action="set-playback-speed" data-speed="1.75" aria-pressed="false">1.75×</button>
              <button type="button" data-action="set-playback-speed" data-speed="2" aria-pressed="false">2×</button>
            </div>
          </div>
          <div class="player-captions-menu" id="player-captions-menu" aria-label="Caption settings" hidden>
            <p>Subtitles and captions</p>
            <div class="player-caption-options"></div>
            <span class="player-caption-empty" hidden>No captions are available for this video.</span>
          </div>
        </div>
      </div>
    </dialog>
    <dialog class="player-dialog" id="trailer-dialog" aria-label="Movie trailer">
      <button class="dialog-close" type="button" data-action="close-trailer" aria-label="Close trailer">Close</button>
      <iframe id="trailer-frame" title="Movie trailer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </dialog>
      <script src="./tmdb.js" defer></script>
      <script src="./app.js" defer></script>
  </body>
</html>
